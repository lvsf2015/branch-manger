<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="icon/favicon.svg" />
  <title>分支名生成器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { overflow: hidden; height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }

    /* -------- 整体容器：左右布局 -------- */
    .layout {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1220px;
      height: 100%;
      align-items: flex-start;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 32px 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border-top: 3px solid #4f46e5;
    }
    .panel-left  {
      flex: 0 0 500px;
      max-height: 100%;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #c4b5fd transparent;
    }
    .panel-left::-webkit-scrollbar { width: 6px; }
    .panel-left::-webkit-scrollbar-track { background: transparent; }
    .panel-left::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #c4b5fd, #8b5cf6); border-radius: 999px; }
    .panel-right { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    h1 {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    textarea {
      width: 100%;
      height: 88px;
      padding: 10px 34px 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      color: #1a1a1a;
    }
    textarea:focus { border-color: #4f46e5; }

    .input-clear {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .input-clear:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .examples {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .example-tag {
      font-size: 12px;
      color: #4f46e5;
      background: #ede9fe;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .example-tag:hover { background: #ddd6fe; }

    .env-row {
      margin-top: 12px;
    }
    .env-select {
      width: 100%;
      padding: 9px 34px 9px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .env-select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
    }

    .gen-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 14px rgba(79, 70, 229, 0.38);
      letter-spacing: 0.5px;
    }
    .gen-btn:hover {
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
      box-shadow: 0 5px 18px rgba(79, 70, 229, 0.48);
      transform: translateY(-1px);
    }
    .gen-btn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3); }

    .result-box { margin-top: 18px; display: none; }
    .result-label { font-size: 13px; color: #555; margin-bottom: 6px; }
    .result-content { display: flex; align-items: center; gap: 8px; }
    .result-text {
      flex: 1;
      padding: 10px 12px;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 13px;
      font-family: "SF Mono", "Fira Code", monospace;
      color: #1a1a1a;
      word-break: break-all;
    }
    .copy-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      color: #fff;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.32);
    }
    .copy-btn:hover { background: linear-gradient(135deg, #4338ca, #6d28d9); box-shadow: 0 3px 12px rgba(79, 70, 229, 0.44); transform: translateY(-1px); }
    .copy-btn.copied { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 2px 8px rgba(16, 185, 129, 0.32); }

    .error-msg { margin-top: 8px; font-size: 13px; color: #ef4444; display: none; }

    /* -------- 左侧月视图日历 -------- */
    .calendar-card {
      margin-top: 18px;
      padding: 16px 16px 14px;
      border: 1px solid #ebe8ff;
      border-radius: 12px;
      background:
        radial-gradient(circle at top left, rgba(124, 58, 237, 0.10), transparent 34%),
        linear-gradient(180deg, #fcfbff 0%, #f6f3ff 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }
    .calendar-title-wrap { min-width: 0; }
    .calendar-label {
      font-size: 11px;
      color: #7c3aed;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .calendar-title {
      margin-top: 2px;
      font-size: 18px;
      font-weight: 700;
      color: #1f1b3a;
    }
    .calendar-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: #8b87a8;
    }
    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .calendar-nav-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #ddd6fe;
      border-radius: 999px;
      background: rgba(255,255,255,0.86);
      color: #6d28d9;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s;
    }
    .calendar-nav-btn:hover {
      background: #ede9fe;
      border-color: #c4b5fd;
      transform: translateY(-1px);
    }
    .calendar-today-btn {
      height: 30px;
      padding: 0 10px;
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      background: #f0fdf4;
      color: #15803d;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s;
    }
    .calendar-today-btn:hover {
      background: #dcfce7;
      border-color: #86efac;
      transform: translateY(-1px);
    }
    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .calendar-weekdays {
      margin-bottom: 6px;
    }
    .calendar-weekday {
      text-align: center;
      font-size: 11px;
      color: #8b87a8;
      font-weight: 600;
      padding: 4px 0;
    }
    .calendar-weekday.is-weekend {
      color: #16a34a;
    }
    .calendar-day {
      min-height: 58px;
      border-radius: 10px;
      padding: 7px 0 6px 6px;
      background: rgba(255,255,255,0.88);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      width: 100%;
      text-align: left;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .calendar-day.is-current-month {
      border-color: #ece8ff;
      box-shadow: 0 1px 2px rgba(79, 70, 229, 0.04);
    }
    .calendar-day.is-other-month {
      background: rgba(255,255,255,0.45);
      color: #b8b2d2;
    }
    .calendar-day.is-today {
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.16), 0 8px 18px rgba(34, 197, 94, 0.14);
    }
    .calendar-day.has-record {
      background: linear-gradient(180deg, #ffffff 0%, #f1ebff 100%);
    }
    .calendar-day.is-clickable:hover {
      transform: translateY(-1px);
      border-color: #c4b5fd;
      box-shadow: 0 8px 18px rgba(124, 58, 237, 0.10);
    }
    .calendar-day.is-selected {
      border-color: #6d28d9;
      background: linear-gradient(180deg, #f4efff 0%, #e9ddff 100%);
      box-shadow: 0 0 0 1px rgba(109, 40, 217, 0.14), 0 10px 22px rgba(109, 40, 217, 0.18);
    }
    .calendar-day:focus-visible {
      outline: 2px solid #8b5cf6;
      outline-offset: 2px;
    }
    .calendar-day-top {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .calendar-day-number {
      font-size: 13px;
      font-weight: 700;
      color: #2d2354;
      flex-shrink: 0;
    }
    .calendar-day.is-other-month .calendar-day-number {
      color: #b8b2d2;
    }
    .calendar-day.is-weekend .calendar-day-number,
    .calendar-day.is-holiday .calendar-day-number {
      color: #16a34a;
    }
    .calendar-day.is-workday .calendar-day-number {
      color: #ef4444;
    }
    .calendar-day-meta {
      min-height: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }
    .calendar-badge {
      max-width: 100%;
      font-size: 10px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .calendar-badge.is-holiday {
      color: #16a34a;
    }
    .calendar-badge.is-workday {
      color: #dc2626;
    }
    .calendar-day.is-other-month .calendar-badge.is-holiday {
      color: #86d3a3;
    }
    .calendar-day.is-other-month .calendar-badge.is-workday {
      color: #f1a1a1;
    }
    .calendar-day-count {
      font-size: 10px;
      font-weight: 700;
      color: #6d28d9;
      background: #ede9fe;
      border-radius: 999px;
      padding: 2px 6px;
      margin-left: auto;
    }
    .calendar-day-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }
    .calendar-empty {
      font-size: 12px;
      color: #8b87a8;
      margin-top: 10px;
    }

    @media (max-width: 980px) {
      html, body { overflow: auto; height: auto; }
      body { padding: 20px 14px; }
      .layout { flex-direction: column; max-width: 100%; height: auto; }
      .panel-left, .panel-right {
        flex: none;
        width: 100%;
        max-height: none;
        overflow: visible;
      }
      .calendar-day { min-height: 52px; }
    }

    /* -------- 右侧：历史记录 -------- */
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .history-header h1 { margin-bottom: 0; }
    .history-count { font-size: 12px; color: #bbb; margin-left: 6px; font-weight: 400; }

    /* 进度条 */
    .quota-wrap {
      display: flex; align-items: center; gap: 8px;
      margin-left: 12px; flex: 1; min-width: 0;
    }
    .quota-bar-track {
      flex: 1; height: 7px; background: #e5e7eb;
      border-radius: 99px; overflow: hidden; min-width: 80px; max-width: 140px;
    }
    .quota-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #34d399, #10b981);
      border-radius: 99px;
      transition: width 0.4s ease, background 0.3s;
    }
    .quota-bar-fill.warn   { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    .quota-bar-fill.danger { background: linear-gradient(90deg, #f87171, #ef4444); }
    .quota-label {
      font-size: 12px; font-weight: 700; color: #6b7280; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.2px;
    }
    .quota-label.warn   { color: #f59e0b; }
    .quota-label.danger { color: #ef4444; }

    /* 阈值配置行 */
    .threshold-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; font-size: 12px; color: #888;
    }
    .threshold-bar label {
      flex-shrink: 0;
      margin-bottom: 0;
      line-height: 1;
    }
    .threshold-input {
      width: 60px; padding: 3px 6px; border: 1px solid #d9d9d9;
      border-radius: 6px; font-size: 12px; color: #333; outline: none;
      text-align: center; transition: border-color 0.2s;
      line-height: 1.2;
      vertical-align: middle;
    }
    .threshold-input:focus { border-color: #4f46e5; }
    .threshold-hint {
      color: #bbb;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    .clear-btn {
      font-size: 12px;
      color: #aaa;
      background: none;
      border: 1px solid #e8e8e8;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .clear-btn:hover { color: #ef4444; border-color: #fca5a5; background: #fef2f2; }

    /* 搜索框 */
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-input {
      width: 100%;
      padding: 8px 28px 8px 32px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      color: #1a1a1a;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: #4f46e5; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      font-size: 13px;
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: #bbb;
      font-size: 16px;
      cursor: pointer;
      display: none;
      line-height: 1;
      user-select: none;
    }
    .search-clear:hover { color: #888; }

    /* 日期筛选栏 */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      padding: 6px 10px;
      background: #f9f9fb;
      border: 1px solid #ebebf0;
      border-radius: 8px;
    }
    .filter-label { font-size: 12px; color: #888; flex-shrink: 0; }
    .date-input {
      padding: 5px 8px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 12px;
      color: #333;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .date-input:focus { border-color: #4f46e5; }
    .filter-sep { font-size: 12px; color: #bbb; }
    .filter-reset {
      font-size: 12px; color: #bbb; background: none; border: none;
      cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.15s;
    }
    .filter-reset:hover { color: #4f46e5; }

    /* 一键展开/折叠按钮 */
    .toggle-all-btn {
      font-size: 12px; color: #4f46e5; background: #ede9fe;
      border: 1px solid #c4b5fd; cursor: pointer; padding: 4px 12px;
      border-radius: 6px; transition: all 0.15s; white-space: nowrap;
      font-weight: 500; margin-left: auto;
    }
    .toggle-all-btn:hover { background: #ddd6fe; border-color: #a78bfa; color: #3730a3; }

    /* 日期分组标题 */
    .date-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #555;
      font-weight: 600;
      padding: 10px 6px 6px;
      border-bottom: 1px solid #e8e8e8;
      margin-top: 6px;
      cursor: pointer;
      user-select: none;
      letter-spacing: 0.3px;
    }
    .date-group-header:hover { color: #4f46e5; }
    .date-group-arrow {
      font-size: 10px;
      color: #aaa;
      transition: transform 0.2s;
      margin-left: 4px;
    }
    .date-group-header.collapsed .date-group-arrow { transform: rotate(-90deg); }
    .date-group-items { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
    .date-group-items.collapsed { display: none; }

    /* 导出按钮 */
    .export-btn {
      font-size: 12px; color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none; cursor: pointer; padding: 5px 12px;
      border-radius: 6px; transition: all 0.15s; font-weight: 500;
      box-shadow: 0 1px 6px rgba(79, 70, 229, 0.28);
    }
    .export-btn:hover { background: linear-gradient(135deg, #4338ca, #6d28d9); box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4); transform: translateY(-1px); }

    /* 历史列表 */
    .history-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      scrollbar-gutter: stable;
    }
    .history-list:hover {
      scrollbar-color: #c4b5fd #f3f0ff;
    }
    .history-list::-webkit-scrollbar { width: 6px; }
    .history-list::-webkit-scrollbar-track { background: transparent; border-radius: 8px; }
    .history-list::-webkit-scrollbar-thumb { background: transparent; border-radius: 8px; transition: background 0.2s; }
    .history-list:hover::-webkit-scrollbar-track { background: #f3f0ff; }
    .history-list:hover::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #a78bfa, #7c3aed); }
    .history-list:hover::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #7c3aed, #6d28d9); }
    .history-empty { font-size: 13px; color: #bbb; text-align: center; padding: 40px 0; }
    .history-item {
      padding: 9px 11px;
      background: #fafafa;
      border: 1px solid #efefef;
      border-radius: 8px;
      transition: all 0.15s;
      border-left: 3px solid transparent;
    }
    .history-item:hover { background: #f5f3ff; border-color: #c4b5fd; border-left-color: #7c3aed; }
    .hi-meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .hi-time { font-size: 12px; color: #5b21b6; font-weight: 700; }
    .hi-content-row { display: flex; align-items: center; gap: 2px; margin-bottom: 3px; }
    .hi-content-row:last-child { margin-bottom: 0; }
    .hi-title-text {
      font-size: 12px; color: #666;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .hi-branch-text {
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", monospace;
      color: #1a1a1a;
      word-break: break-all;
      flex: 1;
    }
    .hi-icon-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      padding: 0;
      transition: background 0.15s;
    }
    .hi-icon-btn img { transition: opacity 0.15s; }
    .hi-icon-btn:hover { background: #ede9fe; }
    .hi-icon-btn:hover img { opacity: 1 !important; filter: invert(31%) sepia(90%) saturate(600%) hue-rotate(220deg); }
    .hi-icon-btn.copied img { opacity: 1 !important; filter: invert(52%) sepia(60%) saturate(500%) hue-rotate(120deg); }
    .hi-del-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      padding: 0;
      transition: background 0.15s;
    }
    .hi-del-btn img { transition: opacity 0.15s; }
    .hi-del-btn:hover { background: #fef2f2; }
    .hi-del-btn:hover img { opacity: 1 !important; filter: invert(35%) sepia(80%) saturate(600%) hue-rotate(330deg); }
    .hi-del-btn.pending { background: #fef2f2; }
    .hi-del-btn.pending img { opacity: 1 !important; filter: invert(35%) sepia(80%) saturate(600%) hue-rotate(330deg); }
    mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }

    /* -------- 弹窗 -------- */
    .modal-mask {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.3);

<script>
// ---------- 核心逻辑（与 gb.js 保持一致）----------

function formatDate(date) {
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${m}${d}`;
}

function extractId(desc) {
  const match = desc.match(/^(\d+)/);
  return match ? match[1] : 'unknown';
}

function extractSummary(desc) {
  let text = desc.replace(/^\d+/, '');
  text = text.replace(/[【\[（(][^】\]）)]*[】\]）)]/g, '');

  const cnChars = (text.match(/[\u4e00-\u9fff]/g) || []).slice(0, 20).join('');
  if (cnChars.length > 0) return cnChars;

  const engTokens = (text.match(/[a-zA-Z][a-zA-Z0-9]*/g) || [])
    .map(t => t.toLowerCase())
    .slice(0, 5);
  return engTokens.length > 0 ? engTokens.join('-') : 'fix';
}

function detectEnv(desc) {
  if (/移远/.test(desc)) return 'yiyuan';
  if (/奔驰/.test(desc)) return 'benchi';
  if (/海外|国外/.test(desc)) return 'max';
  return 'other';
}

function normalizeEnv(env) {
  return ['auto', 'yiyuan', 'benchi', 'max', 'other'].includes(env) ? env : 'auto';
}

function generateBranchName(bugDesc, selectedEnv = 'auto') {
  const id      = extractId(bugDesc);
  const summary = extractSummary(bugDesc);
  const date    = formatDate(new Date());
  const manualEnv = normalizeEnv(selectedEnv);
  const env     = manualEnv === 'auto' ? detectEnv(bugDesc) : manualEnv;
  const author  = 'lvshuaif';
  const tag     = /^\d{5}$/.test(id) ? 'Fix' : 'Dev';

  switch (env) {
    case 'yiyuan': return `yiyuan-master-A-${tag}-${id}-${author}-${date}-${summary}`;
    case 'benchi': return `benchi-${tag}-${id}-${author}-${date}-${summary}`;
    case 'max':    return `max-master-A-${tag}-${id}-${author}-${date}-${summary}`;
    default:       return `one-master-A-${tag}-${id}-${author}-${date}-${summary}`;
  }
}

function getDefaultTester(branch) {
  branch = branch || '';
  if (branch.startsWith('max')) return '关帅';
  if (branch.startsWith('benchi')) return '赵仰杰';
  if (branch.startsWith('yiyuan')) return '吕帅锋';
  return '李韶娜';
}

function getBranchCopyPrefix(branch) {
  branch = branch || '';
  if (/-Fix-/.test(branch)) return '* 修复';
  if (/-Dev-/.test(branch)) return '* 迭代';
  return '';
}

function formatReadmeCopyText(branch, title, suffix) {
  const prefix = getBranchCopyPrefix(branch);
  const body = `${prefix ? '  ' : ''}* ${title}${suffix || ''}`;
  return prefix ? `${prefix}\n${body}` : body;
}

const calendarState = (() => {

function toLocalDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function buildHistoryCountMap() {
  return loadHistory().reduce((map, item) => {
    const date = new Date(item.createdAt);
    const key = toLocalDateKey(date);
    map[key] = (map[key] || 0) + 1;
    return map;
  }, {});
}

function setCalendarDateFilter(dateKey) {
  const dateFrom = document.getElementById('dateFrom');
  const dateTo = document.getElementById('dateTo');
  if (!dateFrom || !dateTo) return;

  const isSameDate = calendarState.selectedDate === dateKey;
  if (isSameDate) {
    calendarState.selectedDate = '';
    dateFrom.value = '';
    dateTo.value = '';
  } else {
    calendarState.selectedDate = dateKey;
    dateFrom.value = dateKey;
    dateTo.value = dateKey;

  applyFilters();

function getShortHolidayLabel(label) {

    '劳动节': '劳动',

    '端午': '端午',
    '中秋': '中秋',
    '国庆': '国庆',
    '元旦': '元旦',
  };
  return labelMap[label] || label;
}

function getCalendarBadge(date, key) {
  if (WORKDAY_LABELS[key]) {
    return { text: WORKDAY_LABELS[key], className: 'is-workday' };
  }
  if (HOLIDAY_LABELS[key]) {
    return { text: getShortHolidayLabel(HOLIDAY_LABELS[key]), className: 'is-holiday' };
  }
  return null;
}

function renderCalendarWeekdays() {
  const weekdaysEl = document.getElementById('calendarWeekdays');
  weekdaysEl.innerHTML = CALENDAR_WEEKDAYS.map((day, index) => {
    const isWeekend = index === 0 || index === 6;
    return `<div class="calendar-weekday${isWeekend ? ' is-weekend' : ''}">${day}</div>`;
  }).join('');
}

function renderCalendar() {
  const titleEl = document.getElementById('calendarTitle');
  const subtitleEl = document.getElementById('calendarSubtitle');
  const gridEl = document.getElementById('calendarGrid');
  const emptyEl = document.getElementById('calendarEmpty');
  if (!titleEl || !subtitleEl || !gridEl || !emptyEl) return;

  const { year, month } = calendarState;
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const todayKey = toLocalDateKey(new Date());
  const countMap = buildHistoryCountMap();

  titleEl.textContent = `${year}年${month + 1}月`;
  subtitleEl.textContent = '月视图';

  let monthRecordCount = 0;
  const cells = [];

  for (let index = 0; index < totalCells; index += 1) {
    const dayOffset = index - startOffset + 1;
    let cellDate;
    let inCurrentMonth = true;

    if (dayOffset <= 0) {
      cellDate = new Date(year, month - 1, daysInPrevMonth + dayOffset);
      inCurrentMonth = false;
    } else if (dayOffset > daysInMonth) {
      cellDate = new Date(year, month + 1, dayOffset - daysInMonth);
      inCurrentMonth = false;
    } else {
      cellDate = new Date(year, month, dayOffset);
    }

    const key = toLocalDateKey(cellDate);
    const count = countMap[key] || 0;
    const badge = getCalendarBadge(cellDate, key);
    const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;
    if (inCurrentMonth) monthRecordCount += count;

    const isSelected = calendarState.selectedDate === key;
    const badgeInfo = badge ? badge.className : '';
    const classes = [
      'calendar-day',
      inCurrentMonth ? 'is-current-month' : 'is-other-month',
      isWeekend ? 'is-weekend' : '',
      key === todayKey ? 'is-today' : '',
      count > 0 ? 'has-record' : '',
      'is-clickable',
      isSelected ? 'is-selected' : '',
      badgeInfo,
    ].filter(Boolean).join(' ');

    cells.push(`
      <button type="button" class="${classes}" data-date="${key}" data-current-month="${inCurrentMonth ? '1' : '0'}" title="${key}${count ? ` · ${count} 条记录` : ''}">
        <div class="calendar-day-top">
          <div class="calendar-day-number">${cellDate.getDate()}</div>
          ${badge ? `<span class="calendar-badge ${badge.className}">${badge.text}</span>` : ''}
        </div>
        <div class="calendar-day-meta">
          ${count > 0 ? '<span class="calendar-day-dot"></span>' : ''}
          ${count > 0 ? `<span class="calendar-day-count">${count}</span>` : ''}
        </div>
      </button>
    `);
  }

  gridEl.innerHTML = cells.join('');
  emptyEl.style.display = monthRecordCount > 0 ? 'none' : 'block';
  subtitleEl.textContent = calendarState.selectedDate
    ? `已筛选 ${calendarState.selectedDate}`
    : (monthRecordCount > 0 ? `本月累计 ${monthRecordCount} 条分支记录` : '月视图');

  gridEl.querySelectorAll('.calendar-day').forEach(dayEl => {
    dayEl.addEventListener('click', () => {
      const dateKey = dayEl.dataset.date;
      const isCurrentMonth = dayEl.dataset.currentMonth === '1';
      if (!isCurrentMonth) {
        const [year, month] = dateKey.split('-').map(Number);
        calendarState.year = year;
        calendarState.month = month - 1;
      }
      setCalendarDateFilter(dateKey);
    });
  });
}

let _toastTimer = null;
function showToast(msg, type) {
  const el   = document.getElementById('toast');
  const text = document.getElementById('toastText');
  text.textContent = msg;
  el.classList.remove('toast-error', 'toast-warning');
  if (type === 'error')   el.classList.add('toast-error');
  if (type === 'warning') el.classList.add('toast-warning');
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = type === 'warning'
    ? null
    : setTimeout(() => el.classList.remove('show'), 2200);
}

function copyText(text, btn, toastMsg) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn.classList.contains('hi-icon-btn')) {
      btn.classList.add('copied');
      setTimeout(() => { btn.classList.remove('copied'); }, 1500);
    } else {
      const prev = btn.textContent;
      btn.textContent = '已复制 ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = prev; btn.classList.remove('copied'); }, 1500);
    }
    showToast(toastMsg || '已复制 ✓');
  });
}

// ---------- 导出 Markdown ----------

function exportMarkdown(suffix) {
  const list = loadHistory();
  if (list.length === 0) return;

  // 按日期分组（倒序）
  const WEEK = ['日','一','二','三','四','五','六'];
  const groups = {};
  list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(item => {
    const d = new Date(item.createdAt);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    (groups[key] = groups[key] || []).push(item);
  });

  const lines = [
    '# 分支名历史记录',
    '',
    `> 导出时间：${new Date().toLocaleString('zh-CN')}　共 ${list.length} 条`,
  ];

  Object.keys(groups).sort((a, b) => b.localeCompare(a)).forEach(dateKey => {
    const d = new Date(dateKey + 'T00:00:00');
    const label = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${WEEK[d.getDay()]}`;
    lines.push('', `## ${label}  (${groups[dateKey].length})`);
    groups[dateKey].forEach(item => {
      const d2 = new Date(item.createdAt);
      const hhmm = `${String(d2.getHours()).padStart(2,'0')}:${String(d2.getMinutes()).padStart(2,'0')}`;
      lines.push(
        '',
        `**${hhmm}**`,
        `${item.title}`,
        `\`${item.branch}\``,
      );
    });
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  const _now = new Date();
  const _pad = n => String(n).padStart(2, '0');
  const _ts  = `${_now.getFullYear()}${_pad(_now.getMonth()+1)}${_pad(_now.getDate())}${_pad(_now.getHours())}${_pad(_now.getMinutes())}${_pad(_now.getSeconds())}`;
  a.download = `branch-history-${_ts}${suffix || ''}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

function isEditableElement(el) {
  if (!el || !(el instanceof Element)) return false;
  return el.matches('input, textarea, [contenteditable="true"], [contenteditable=""], [contenteditable="plaintext-only"]');
}

  if (!text) return;

  if (target === mainInput) {
    e.preventDefault();
    replaceMainInput(text.trim());
    return;
  }

  if (isEditableElement(target)) return;

  e.preventDefault();
  replaceMainInput(text.trim());
});

// ---------- 阈值配置 ----------
const THRESHOLD_KEY = 'gb_threshold';

function getThreshold() {
  const v = parseInt(localStorage.getItem(THRESHOLD_KEY), 10);
  return (!isNaN(v) && v > 0) ? v : 80;
}

function setThreshold(v) {
  localStorage.setItem(THRESHOLD_KEY, String(v));
}

function checkQuotaWarning(count) {
  const threshold = getThreshold();
  if (count < threshold) return;
  const pct = Math.round(count / HISTORY_MAX * 100);
  if (typeof showToast === 'function') {
    showToast(`历史记录已达 ${count} 条（${pct}%），建议导出备份后清理`, 'warning');
  }
}

function updateQuotaColor(count) {
  const wrap  = document.getElementById('historyQuota');
  const fill  = document.getElementById('quotaBarFill');
  const label = document.getElementById('quotaLabel');
  if (!wrap || !fill || !label) return;
  if (count <= 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  const pct       = Math.min(100, Math.round(count / HISTORY_MAX * 100));
  const threshold = getThreshold();
  const level     = count >= threshold ? (pct >= 90 ? 'danger' : 'warn') : '';
  fill.style.width = pct + '%';
  fill.className   = 'quota-bar-fill' + (level ? ' ' + level : '');
  label.className  = 'quota-label'    + (level ? ' ' + level : '');
  label.textContent = `${count} / ${HISTORY_MAX}`;
}

// 阈值输入框初始化与监听
const thresholdInput = document.getElementById('thresholdInput');
thresholdInput.value = getThreshold();
thresholdInput.addEventListener('change', () => {
  const v = parseInt(thresholdInput.value, 10);
  if (!isNaN(v) && v > 0 && v <= HISTORY_MAX) {
    setThreshold(v);
    updateQuotaColor(loadHistory().length);
  } else {
    thresholdInput.value = getThreshold();
  }
});
